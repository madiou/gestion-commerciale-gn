name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # L'émulateur Firestore utilisé par `npm run test:rules` a besoin d'un JRE.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - run: npm test

      - run: npm run test:rules

      # Les tests e2e (npm run test:e2e) démarrent eux-mêmes les émulateurs Hosting/Firestore/Auth
      # (voir playwright.config.js) — il ne faut qu'installer le navigateur au préalable.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
